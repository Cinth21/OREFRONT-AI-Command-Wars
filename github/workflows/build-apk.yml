
name: Build OREFRONT Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test game rules and real six-player loopback TCP sockets
        run: |
          mkdir -p /tmp/orefront-tests
          javac -d /tmp/orefront-tests \
            app/src/main/java/com/student/orefront/GameCore.java \
            app/src/main/java/com/student/orefront/LanRoom.java \
            tests/StrategySmokeTest.java \
            tests/SixPlayerLanTest.java \
            tests/BattleResultsTest.java
          java -cp /tmp/orefront-tests StrategySmokeTest
          java -cp /tmp/orefront-tests SixPlayerLanTest
          java -cp /tmp/orefront-tests BattleResultsTest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename deliverable
        run: cp app/build/outputs/apk/debug/app-debug.apk OREFRONT-AI-Command-Wars.apk

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: OREFRONT-Android-APK
          path: OREFRONT-AI-Command-Wars.apk
          retention-days: 30
