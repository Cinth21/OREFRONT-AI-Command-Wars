
name: Build OREFRONT Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OREFRONT_AI_Command_Wars_Android_Source

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test game and multiplayer
        run: |
          mkdir -p /tmp/orefront-tests
          javac -d /tmp/orefront-tests \
            app/src/main/java/com/student/orefront/GameCore.java \
            app/src/main/java/com/student/orefront/LanRoom.java \
            tests/StrategySmokeTest.java \
            tests/SixPlayerLanTest.java \
            tests/BattleResultsTest.java
          java -cp /tmp/orefront-tests StrategySmokeTest
          java -cp /tmp/orefront-tests SixPlayerLanTest
          java -cp /tmp/orefront-tests BattleResultsTest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OREFRONT-AI-Command-Wars.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OREFRONT-Android-APK
          path: OREFRONT_AI_Command_Wars_Android_Source/OREFRONT-AI-Command-Wars.apk

